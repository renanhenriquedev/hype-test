name: Backend CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checar o código
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image for backend
        run: |
          docker build -t your-docker-repo/backend:latest -f backend/Dockerfile .
          docker push your-docker-repo/backend:latest

      - name: Run tests inside Docker container
        run: |
          docker run --rm your-docker-repo/backend:latest npm run test

      - name: Build project
        run: |
          docker run --rm your-docker-repo/backend:latest npm run build

      - name: Deploy to production (exemplo com Docker)
        run: |
          docker run --rm your-docker-repo/backend:latest
