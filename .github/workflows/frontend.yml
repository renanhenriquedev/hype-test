name: Frontend CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image for frontend
        run: |
          docker build -t your-docker-repo/frontend:latest -f frontend/Dockerfile --build-arg VITE_API_URL=${{ secrets.VITE_API_URL }} --build-arg VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }} --build-arg VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }} --build-arg VITE_FIREBASE_PROJECT_ID=${{ secrets.VITE_FIREBASE_PROJECT_ID }} .
          docker push your-docker-repo/frontend:latest

      - name: Run tests for frontend
        run: |
          docker run --rm your-docker-repo/frontend:latest npm run test

      - name: Build frontend project
        run: |
          docker run --rm your-docker-repo/frontend:latest npm run build

      - name: Deploy to production (exemplo com Docker)
        run: |
          docker run --rm -d -p 80:80 your-docker-repo/frontend:latest
